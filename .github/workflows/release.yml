name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main and matches @standard-version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
          version="$(grep -oP '@standard-version\s+\K\S+' templates/.copilotignore)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error file=templates/.copilotignore::Tag ${GITHUB_REF_NAME} does not match @standard-version ${version}."
            exit 1
          fi

      - name: Build release assets
        run: |
          mkdir -p dist
          pwsh -NoProfile -File ./scripts/Set-CopilotIgnore.ps1 -ContentExclusionOutFile ./dist/content-exclusion.org.yml
          zip -r "dist/copilot-context-policy-${GITHUB_REF_NAME}.zip" templates scripts pipelines README.md LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Move major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/${major}"
